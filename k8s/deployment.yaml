apiVersion: apps/v1
kind: Deployment
metadata:
  name: calculator-deployment
  labels:
    app: calculator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: calculator
  template:
    metadata:
      labels:
        app: calculator # ◄ Fixed: Removed the trailing 'a'
    spec:
      containers:
      - name: calculator
        image: calculator-app:latest # ◄ Fixed: Point to your new local image
        imagePullPolicy: IfNotPresent # ◄ Prevents Kubernetes from looking for it online
        ports:
        - containerPort: 5000